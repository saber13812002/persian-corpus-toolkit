# =============================================================================
# PCM-20.6.4 (B12) — Tasnim Web V1: edge nginx vhost (public port 5070)
# -----------------------------------------------------------------------------
# Thin reverse proxy in front of the API container (internal 5071, which is
# NOT published to the host). Responsibilities ONLY:
#   * listen on 5070 (the single public port for this service)
#   * forward / and /api/ to the API container over the compose network
#   * set X-Forwarded-For / X-Forwarded-Proto / Host — the API's DB-backed
#     rate limiter buckets on the FIRST X-Forwarded-For IP (api.py:
#     `xf.split(",")[0]`), so this header is what makes per-client limits work
#   * gzip for text/html + css + js
#   * minimal security headers + small client_max_body_size (read-only API:
#     the largest legitimate body is a long /search?q=... in the URL, so a
#     small cap is pure protection)
#
# Mount (see docker-compose.tasnim.yml):
#   - ./tasnim/nginx/tasnim.conf:/etc/nginx/conf.d/tasnim.conf:ro
# nginx:1.27-alpine ships with /etc/nginx/nginx.conf (http-level) that
# includes /etc/nginx/conf.d/*.conf inside the http{} block, so this file
# defines a complete server{} only.
# =============================================================================

# Upstream = compose service name. The api container listens on 5071 inside
# the tasnim-net network only; it is not reachable from the host at all.
upstream tasnim_api {
    server tasnim-api:5071;
    keepalive 32;
}

# Gzip: html/css/js only, modest window, only when the client asks for it.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types text/html text/css application/javascript;

server {
    listen 5070;
    listen [::]:5070;
    server_name _;

    # Read-only service: reject large bodies outright.
    client_max_body_size 64k;

    access_log /var/log/nginx/tasnim.access.log;
    error_log  /var/log/nginx/tasnim.error.log warn;

    # ------------------------------------------------------------------ /api
    # The 12-endpoint API + /openapi.json + /docs (all under /api/v1/tasnim/).
    location /api/ {
        proxy_pass http://tasnim_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Rate limiter buckets on this first IP; XFF is append-only, so an
        # externally forged XFF still ends up *after* the real client IP and
        # never becomes the bucket key on its own.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Security headers (applied to every proxied response).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --------------------------------------------------------------------- /
    # Everything else = the SSR frontend + /static assets (same Flask app).
    location / {
        proxy_pass http://tasnim_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
