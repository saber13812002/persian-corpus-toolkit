# corpus.ai.ismc.ir — server 52 vhost
# live path: /www/server/panel/vhost/nginx/corpus.ai.ismc.ir.conf
# proxies to the Flask backend on 127.0.0.1:5055

server {
    listen 80;
    server_name corpus.ai.ismc.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name corpus.ai.ismc.ir;

    ssl_certificate     /etc/letsencrypt/live/corpus.ai.ismc.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corpus.ai.ismc.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /www/wwwlogs/corpus.ai.ismc.ir.log;
    error_log  /www/wwwlogs/corpus.ai.ismc.ir.error.log;

    client_max_body_size 20m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
