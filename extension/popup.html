<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 420px; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 13px; background: #1a1a2e; color: #e0e0e0; }
    .header { background: linear-gradient(135deg, #16213e, #0f3460); padding: 14px; text-align: center; }
    .header h1 { font-size: 16px; color: #e94560; margin-bottom: 2px; }
    .header span { font-size: 11px; color: #a0a0b0; }
    .content { padding: 12px; }
    .site-selector { display: flex; gap: 6px; margin-bottom: 12px; }
    .site-btn {
      flex: 1; padding: 8px; border: 2px solid #0f3460; border-radius: 8px;
      background: #16213e; color: #a0a0b0; cursor: pointer; font-family: inherit;
      font-size: 12px; text-align: center;
    }
    .site-btn.active { border-color: #e94560; color: #e94560; background: #1a0a1a; }
    .site-btn .icon { font-size: 18px; display: block; margin-bottom: 2px; }
    .section { margin-bottom: 12px; }
    .section-title { font-size: 11px; color: #64748b; margin-bottom: 6px; letter-spacing: 1px; }
    .btn-row { display: flex; gap: 6px; margin-bottom: 6px; }
    button {
      flex: 1; padding: 9px 6px; border: none; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 11px; font-weight: 600;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #e94560; color: white; }
    .btn-secondary { background: #0f3460; color: #e0e0e0; }
    .btn-green { background: #2ecc71; color: white; }
    .btn-orange { background: #e67e22; color: white; }
    .btn-stop { background: #c0392b; color: white; }
    .btn-teal { background: #1abc9c; color: white; }
    .btn-blue { background: #3498db; color: white; }
    .stats { background: #16213e; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .stat-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; border-bottom: 1px solid #0f3460; }
    .stat-row:last-child { border-bottom: none; }
    .stat-val { color: #e94560; font-weight: 600; }
    .hint { font-size: 10px; color: #94a3b8; margin-top: 6px; line-height: 1.5; }
    .log { background: #0d1117; border-radius: 6px; padding: 8px; max-height: 120px; overflow-y: auto; font-size: 10px; font-family: Consolas, monospace; }
    .log .ok { color: #2ecc71; } .log .err { color: #e74c3c; } .log .info { color: #3498db; } .log .warn { color: #f39c12; }
    .status-bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: #0f3460; font-size: 11px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.idle { background: #7f8c8d; }
    .dot.running { background: #2ecc71; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 Persian Corpus Crawler</h1>
    <span>فاز ۱ لیست یکتا → فاز ۲ ذخیره کامل</span>
  </div>
  <div class="status-bar">
    <div class="dot idle" id="statusDot"></div>
    <span id="statusText">آماده</span>
    <span style="margin-right:auto;font-size:10px;color:#64748b" id="siteTag"></span>
  </div>
  <div class="content">
    <div class="site-selector">
      <button type="button" class="site-btn active" id="siteThesaurus" data-site="thesaurus">
        <span class="icon">📖</span>اصطلاح‌نامه
      </button>
      <button type="button" class="site-btn" id="siteKhamenei" data-site="khamenei">
        <span class="icon">🎤</span>بیانات
      </button>
    </div>

    <div class="section">
      <div class="section-title">فاز ۱ — لیست صفحات (بدون تکرار)</div>
      <div class="btn-row">
        <button type="button" class="btn-orange" id="btnPhase1">🌱 فاز ۱: کشف لیست</button>
        <button type="button" class="btn-secondary" id="btnReset">🔄 Reset صف</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">فاز ۲ — ذخیره کامل تا انتها</div>
      <div class="btn-row">
        <button type="button" class="btn-blue" id="btnPhase2">💾 فاز ۲: ذخیره کامل</button>
        <button type="button" class="btn-green" id="btnSingle">📄 این صفحه</button>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-primary" id="btnFull">🚀 هر دو فاز</button>
        <button type="button" class="btn-stop" id="btnStop" disabled>⏹ توقف</button>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-teal" id="btnDashboard">📊 داشبورد</button>
        <button type="button" class="btn-orange" id="btnResetPhase2" title="پاک کردن بیانات ذخیره‌شده و بازگرداندن صف فاز۲">🔄 ریست فاز۲ تاریخ</button>
      </div>
      <div class="hint" id="hintBox"></div>
    </div>

    <div class="stats">
      <div class="stat-row"><span>📋 لیست یکتا:</span><span class="stat-val" id="statListed">-</span></div>
      <div class="stat-row"><span>⏳ مانده فاز۲:</span><span class="stat-val" id="statPending">-</span></div>
      <div class="stat-row"><span>✅ ذخیره‌شده:</span><span class="stat-val" id="statSaved">-</span></div>
      <div class="stat-row"><span>📅 آخرین:</span><span class="stat-val" id="statLast">-</span></div>
    </div>
    <div class="log" id="logBox"><div class="entry info">🟢 آماده — ابتدا فاز ۱ سپس فاز ۲</div></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
