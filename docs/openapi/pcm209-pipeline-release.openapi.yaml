openapi: 3.0.3
info:
  title: "Persian Corpus Toolkit — Knowledge Studio: Canonical Pipeline & Release (PCM-20.9)"
  version: 1.2.0
  description: |
    PCM-20.9 additive extension of the Corpus Knowledge Studio API
    (`/api/knowledge/*`) covering the canonical-corpus pipeline stages
    D/E, the final release bundle, and the Full Pipeline orchestrator
    (run/pause/resume/status + nightly schedules) of RECON §8.

    Stage D — canonical corpus build (`c-1`):
    - POST /api/knowledge/collections/{coll_id}/corpus/build
    - GET  /api/knowledge/collections/{coll_id}/corpus/builds
    - GET  /api/knowledge/index-builds/{iv_id}

    Stage E — search acceptance + index approval:
    - POST /api/knowledge/collections/{coll_id}/search-acceptance
    - POST /api/knowledge/index-builds/{iv_id}/approve

    Release (final bundle, `rel-1`):
    - POST /api/knowledge/collections/{coll_id}/release
    - GET  /api/knowledge/collections/{coll_id}/releases
    - GET  /api/knowledge/releases/{release_id}/download

    Audit trail (append-only, PCM-20.9):
    - GET  /api/knowledge/collections/{coll_id}/audit

    Pipeline orchestration (PCM-20.9, RECON §8):
    - POST /api/knowledge/collections/{coll_id}/pipeline/run
    - POST /api/knowledge/collections/{coll_id}/pipeline/pause
    - POST /api/knowledge/collections/{coll_id}/pipeline/resume
    - GET  /api/knowledge/collections/{coll_id}/pipeline/status
    - GET  /api/knowledge/pipeline/schedules
    - POST /api/knowledge/pipeline/schedules

    Guarantees:
    - Every stage runs as a `knowledge_jobs` row (202 + `job.job_id`);
      progress via GET /api/knowledge/jobs/{job_id} (PCM-14 surface).
    - Stage D is idempotent: same document set -> same `iv_id` (sha of
      the content), reused without rebuild.
    - Stage E acceptance validates the 10 canonical categories against
      the LIVE alias. `approve` is a HARD gate: it only succeeds after
      `search_status=pass` AND `es_index_status=success`; it then sets
      the collection's `current_index_build` and `validation_status=accepted`.
    - The release bundle re-verifies the corpus archive hash on disk and
      re-validates every source dump (d-1, V1..V11) before packing.
      `rag_status` is honest: `blocked` when PCT_RAG_INGEST_URL is unset
      (unknown RAG contract), `failed` when a configured ingest refuses.
    - All endpoints are protected by PCM-09 session auth (cookie).
    - Responses use `{"ok": true, ...}` / `{"ok": false, "message": ..., "field"?: ...}`.
servers:
  - url: https://corpus.ai.ismc.ir
    description: production (s52)
tags:
  - name: pipeline
    description: Canonical corpus build + search acceptance (PCM-20.9 Stage D/E)
  - name: release
    description: Release bundle + audit trail (PCM-20.9 final)
security:
  - cookieAuth: []
paths:
  /api/knowledge/collections/{coll_id}/corpus/build:
    post:
      tags: [pipeline]
      operationId: startCorpusBuild
      summary: Start the Stage D canonical corpus build (job, guarded)
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Idempotent hit — the corpus for this content already exists (job reused)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobResult" }
                  - type: object
                    properties:
                      documents: { type: integer, example: 12 }
        "202":
          description: Corpus build queued
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobResult" }
                  - type: object
                    properties:
                      documents: { type: integer, example: 12 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No processed documents yet (no_processed_documents)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/knowledge/collections/{coll_id}/corpus/builds:
    get:
      tags: [pipeline]
      operationId: listCorpusBuilds
      summary: List the collection's canonical corpus builds (newest first)
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Builds for this collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  collection_id: { type: string, example: "c-01234567" }
                  builds:
                    type: array
                    items: { $ref: "#/components/schemas/IndexBuild" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/knowledge/index-builds/{iv_id}:
    get:
      tags: [pipeline]
      operationId: indexBuildDetail
      summary: One build row + its canonical corpus manifest (when on disk)
      parameters:
        - { name: iv_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Build detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  build:
                    allOf:
                      - { $ref: "#/components/schemas/IndexBuild" }
                      - type: object
                        properties:
                          manifest:
                            type: [object, "null"]
                            description: corpus-manifest.json (c-1) when readable from out_dir
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/knowledge/collections/{coll_id}/search-acceptance:
    post:
      tags: [pipeline]
      operationId: startSearchAcceptance
      summary: Start the Stage E search acceptance (job, guarded)
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Idempotent hit (job already queued for this content)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        "202":
          description: Search acceptance queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No Stage D corpus build yet (no_corpus_build)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/knowledge/index-builds/{iv_id}/approve:
    post:
      tags: [pipeline]
      operationId: approveIndexBuild
      summary: Approve an index version (hard gate after Stage E pass)
      parameters:
        - { name: iv_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Build approved; collection.current_index_build updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  iv_id: { type: string, example: "iv-0a1b2c3d" }
                  collection_id: { type: string, example: "c-01234567" }
                  validation_status: { type: string, example: accepted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Hard-gate failure — either the full search acceptance has not
            passed (code: acceptance_not_passed, body carries search_status)
            or the ES index is not success (code: es_not_success, body
            carries es_index_status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/knowledge/collections/{coll_id}/release:
    post:
      tags: [release]
      operationId: buildRelease
      summary: Build the final release bundle (job, guarded)
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Idempotent hit (release for this content already built)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobResult" }
                  - type: object
                    properties:
                      documents: { type: integer, example: 12 }
        "202":
          description: Release build queued
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobResult" }
                  - type: object
                    properties:
                      documents: { type: integer, example: 12 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No Stage D corpus build yet (no_corpus_build)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/knowledge/collections/{coll_id}/releases:
    get:
      tags: [release]
      operationId: listReleases
      summary: List the collection's releases
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Releases for this collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  collection_id: { type: string, example: "c-01234567" }
                  releases:
                    type: array
                    items: { $ref: "#/components/schemas/Release" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/knowledge/releases/{release_id}/download:
    get:
      tags: [release]
      operationId: downloadRelease
      summary: Download the release zip (re-hashed on disk before serving)
      parameters:
        - { name: release_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Release data zip (application/zip)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: On-disk hash mismatch (hash_mismatch) — download refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Zip file missing on disk (zip_missing) — release row exists but the file is gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/knowledge/collections/{coll_id}/audit:
    get:
      tags: [release]
      operationId: collectionAudit
      summary: Append-only audit trail of collection actions
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100, minimum: 1, maximum: 500 }, description: "Clamped to 1..500; there is no offset (newest first, LIMIT only)" }
      responses:
        "200":
          description: Audit entries (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  collection_id: { type: string, example: "c-01234567" }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  count: { type: integer, example: 7 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/knowledge/collections/{coll_id}/pipeline/run:
    post:
      tags: [pipeline]
      operationId: pipelineRun
      summary: Start (or restart) the Full Pipeline run for this collection (job)
      description: |
        The run is a per-collection singleton (natural lock): while a run is
        active (or paused), a second start returns 409 conflicting_job.
        An optional `from_stage` restarts the run from that stage — stages
        before it keep their checkpointed state; the stage and everything
        after it is reset and re-executed.
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from_stage:
                  type: string
                  enum: [A_IMPORT, B_PROCESS, C_SCHEMA, D_BUILD, E_ACCEPT, RELEASE]
      responses:
        "200":
          description: Idempotent hit — a run is already tracked (job reused)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobResult" }
                  - type: object
                    properties:
                      run_id: { type: string, example: "pr-0a1b2c3d" }
        "202":
          description: Pipeline run queued
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobResult" }
                  - type: object
                    properties:
                      run_id: { type: string, example: "pr-0a1b2c3d" }
        "400":
          description: "Bad from_stage (code: unknown_stage; body lists valid stages)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "A run is already active or paused (code: conflicting_job)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/knowledge/collections/{coll_id}/pipeline/pause:
    post:
      tags: [pipeline]
      operationId: pipelinePause
      summary: Pause the active pipeline run (the worker self-interrupts between stages)
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Run paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  run_id: { type: string, example: "pr-0a1b2c3d" }
                  status: { type: string, enum: [paused] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No run yet (no_run) or the run is not running (not_running)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/knowledge/collections/{coll_id}/pipeline/resume:
    post:
      tags: [pipeline]
      operationId: pipelineResume
      summary: Resume a paused pipeline run (checkpointed stages are skipped)
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
      responses:
        "202":
          description: Resume queued (job re-submitted with force_retry)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/JobResult" }
                  - type: object
                    properties:
                      run_id: { type: string, example: "pr-0a1b2c3d" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No run yet (no_run) or the run is not paused (not_paused)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/knowledge/collections/{coll_id}/pipeline/status:
    get:
      tags: [pipeline]
      operationId: pipelineStatus
      summary: Pipeline run + per-stage cards (UI statuses) + live queue counters
      description: |
        Card statuses: NOT_STARTED, READY (previous stage done, run active),
        RUNNING, PAUSED, STALE (worker lost), SUCCESS, FAILED, NEEDS_REVIEW,
        BLOCKED. BLOCKED/NEEDS_REVIEW are recorded and the run continues;
        only FAILED stops the run.
      parameters:
        - { name: coll_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Pipeline status payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/knowledge/pipeline/schedules:
    get:
      tags: [pipeline]
      operationId: pipelineSchedulesList
      summary: List the nightly pipeline schedules
      responses:
        "200":
          description: All schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  schedules:
                    type: array
                    items: { $ref: "#/components/schemas/PipelineSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [pipeline]
      operationId: pipelineScheduleUpsert
      summary: Create or update the nightly schedule of a collection
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection_id]
              properties:
                collection_id: { type: integer, example: 12 }
                enabled: { type: boolean, example: true }
                cron_time: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", default: "03:00", example: "03:00" }
      responses:
        "200":
          description: Schedule upserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  schedule: { $ref: "#/components/schemas/PipelineSchedule" }
        "400":
          description: Bad collection_id (bad_collection_id) or bad cron_time (bad_cron_time)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pct_session
  schemas:
    JobObject:
      type: object
      description: knowledge_jobs row
      properties:
        job_id: { type: string, example: "j-0a1b2c3d" }
        job_key: { type: string, example: "corpus_build:c-01234567" }
        kind: { type: string, example: corpus_build }
        collection_id: { type: string, example: "c-01234567" }
        status: { type: string, enum: [queued, running, succeeded, failed, interrupted] }
        stage: { type: [string, "null"], example: "corpus c-60d313c9" }
        total: { type: integer, example: 4 }
        done: { type: integer, example: 0 }
        error: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    JobResult:
      type: object
      properties:
        ok: { type: boolean, example: true }
        queued: { type: boolean, example: true }
        job: { $ref: "#/components/schemas/JobObject" }
    IndexBuild:
      type: object
      description: knowledge_index_builds row
      properties:
        iv_id: { type: string, example: "iv-0a1b2c3d" }
        collection_id: { type: string, example: "c-01234567" }
        es_index: { type: [string, "null"], example: "pct-c01234567" }
        es_alias: { type: [string, "null"], example: "pct-c01234567-live" }
        schema_version: { type: [string, "null"] }
        norm_version: { type: [string, "null"] }
        chunking_version: { type: [string, "null"] }
        chunk_count: { type: [integer, "null"] }
        status: { type: string, enum: [planned, running, succeeded, failed] }
        content_sha256: { type: [string, "null"] }
        out_dir: { type: [string, "null"], example: "corpus_builds/c-60d313c9" }
        es_index_status: { type: [string, "null"], enum: [success, blocked, failed, "null"] }
        es_detail: { type: [string, "null"] }
        search_status: { type: [string, "null"], enum: [pass, fail, pending, blocked, "null"] }
        search_detail: { type: [string, "null"] }
        created_at: { type: string }
        completed_at: { type: [string, "null"] }
    Release:
      type: object
      description: knowledge_releases row
      properties:
        release_id: { type: string, example: "rel-642031fe" }
        collection_id: { type: string, example: "c-01234567" }
        build_iv_id: { type: string, example: "iv-0a1b2c3d" }
        content_sha256: { type: string }
        zip_path: { type: string }
        zip_sha256: { type: string }
        size_bytes: { type: integer }
        rag_status: { type: string, enum: [blocked, failed, success] }
        created_at: { type: string }
    AuditEntry:
      type: object
      description: One knowledge_audit_log row as returned by the audit endpoint (append-only)
      properties:
        ts: { type: string }
        actor: { type: string, example: "worker", description: "sess-<sha8> | worker | system" }
        stage: { type: string, example: release, description: "import | process | schema | build | acceptance | release | pipeline | ..." }
        action: { type: string, example: release_built }
        status: { type: string, enum: [ok, fail, blocked] }
        detail_json: { type: [string, "null"], description: "JSON string of the action detail" }
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        code: { type: [string, "null"], example: no_corpus_build }
        field: { type: [string, "null"] }
        message: { type: string }
    PipelineRun:
      type: object
      description: knowledge_pipeline_runs row
      properties:
        run_id: { type: string, example: "pr-0a1b2c3d" }
        collection_id: { type: string, example: "c-01234567" }
        status: { type: string, enum: [running, paused, done, failed] }
        trigger_type: { type: string, enum: [manual, nightly] }
        started_stage: { type: [string, "null"], example: A_IMPORT }
        error: { type: [string, "null"] }
        job_id: { type: [string, "null"], example: "j-0a1b2c3d" }
        created_at: { type: string }
        updated_at: { type: string }
        finished_at: { type: [string, "null"] }
    PipelineRunSummary:
      type: object
      description: The reduced run object returned by GET .../pipeline/status
      properties:
        run_id: { type: string, example: "pr-0a1b2c3d" }
        status: { type: string, enum: [running, paused, done, failed] }
        trigger_type: { type: string, enum: [manual, nightly] }
        error: { type: [string, "null"] }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
    PipelineStageCard:
      type: object
      description: One stage card of the pipeline status view
      properties:
        stage:
          type: string
          enum: [A_IMPORT, B_PROCESS, C_SCHEMA, D_BUILD, E_ACCEPT, RELEASE]
        label: { type: string, example: "corpus build" }
        status:
          type: string
          enum: [NOT_STARTED, READY, RUNNING, PAUSED, STALE, SUCCESS, FAILED, NEEDS_REVIEW, BLOCKED]
        detail: { type: [string, "null"], description: JSON string of stage output }
        error: { type: [string, "null"] }
        job_id: { type: [string, "null"], example: "j-0a1b2c3d" }
        started_at: { type: [string, "null"] }
        updated_at: { type: [string, "null"] }
    PipelineStatus:
      type: object
      description: GET .../pipeline/status payload
      properties:
        ok: { type: boolean, example: true }
        collection_id: { type: string, example: "c-01234567" }
        run:
          allOf:
            - { $ref: "#/components/schemas/PipelineRunSummary" }
          nullable: true
          description: null when no run was ever started
        stages:
          type: array
          items: { $ref: "#/components/schemas/PipelineStageCard" }
        queue:
          type: object
          description: Live per-file queue counters (PCM-15, queue_counters)
          properties:
            total: { type: integer }
            pending: { type: integer }
            running: { type: integer }
            succeeded: { type: integer }
            needs_review: { type: integer }
            failed: { type: integer }
            failed_with_safe_stage: { type: integer }
            attempts_total: { type: integer }
        latest_build:
          allOf:
            - { $ref: "#/components/schemas/IndexBuild" }
          nullable: true
        latest_release:
          allOf:
            - { $ref: "#/components/schemas/Release" }
          nullable: true
    PipelineSchedule:
      type: object
      description: knowledge_pipeline_schedules row (nightly)
      properties:
        collection_id: { type: string, example: "c-01234567" }
        enabled: { type: integer, enum: [0, 1] }
        cron_time: { type: string, example: "03:00" }
        updated_at: { type: [string, "null"] }
        last_run_at: { type: [string, "null"] }
        last_status: { type: [string, "null"], example: started }
  responses:
    Unauthorized:
      description: Missing/invalid session
    NotFound:
      description: Unknown collection / build / release
