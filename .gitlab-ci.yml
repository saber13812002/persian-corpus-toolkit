# ============================================================================
# Persian Corpus Toolkit — GitLab CI (PCM-19)
# ----------------------------------------------------------------------------
# TEST-ONLY pipeline. By design there are NO deploy/rollback jobs here:
# AGENTS.md hard rule — production (s52) is touched only through the manual
# review-and-backup procedure in deploy/*.sh, never automatically.
#
# Context: the GitHub repo (origin) is the primary remote; this file is
# consumed by the GitLab CE instance (s52, port 2222 = GitLab, NOT SSH)
# once the project is mirrored there. The pipeline is safe to enable:
# every job is read-only with respect to the codebase and the database —
# the test suite uses a temp DB via pct_test_support and never opens
# backend/thesaurus.db.
#
# NOTE on auth tests: the suite logs in with the test-only password
# "test-secret-123", which pct_test_support sets via os.environ.setdefault
# — so NO CI variable must define PCT_DASHBOARD_PASSWORD (it would win
# over setdefault and every login test would 401).
#
# Jobs
#   1. regression — the full backend test matrix (PCM-12.3 rule:
#                   pct_test_support first, temp DB, order-independent).
#                   188 tests: 182 historical + 18 contract tests
#                   (CT-01..CT-06 in test_api_contract.py).
#   2. openapi    — machine-validity of the additive OpenAPI specs
#                   (deploy/pcm19_openapi_check.py: parse + operationId +
#                   local $ref resolution + path-parameter consistency).
#   3. client     — syntax check of the stdlib-only third-party REST
#                   client sample (deploy/pcm19_rest_client_sample.py).
#
# Requires a Docker executor; no variables, no secrets, no network beyond
# the public Python index.
# ============================================================================

image: python:3.12-slim

default:
  interruptible: true
  before_script:
    - python -m pip install --quiet --upgrade pip
    - python -m pip install --quiet -r backend/requirements.txt pyyaml
  variables:
    PYTHONUNBUFFERED: "1"
    # The test bootstrap (pct_test_support) always points server.DB_PATH
    # at a fresh temp file; make the intent explicit in CI too.
    PCT_DB: "/tmp/pct-ci-$CI_JOB_ID.db"

stages:
  - test

regression:
  stage: test
  script:
    - cd backend
    - >
      python -m unittest
      test_api test_projects test_dashboard
      test_knowledge_api test_word_factory test_dump
      test_work_registry test_queue test_corpus_builder
      test_studio_api test_api_contract -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

openapi:
  stage: test
  script:
    - python deploy/pcm19_openapi_check.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

client:
  stage: test
  script:
    - python -m py_compile deploy/pcm19_rest_client_sample.py
    - python -m py_compile deploy/pcm19_openapi_check.py
    - python deploy/pcm19_rest_client_sample.py --help > /dev/null
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
